name: Build APK & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Flavor to build (google, fdroid, or all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - google
          - fdroid
      build_type:
        description: 'Build type (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      create_release:
        description: 'Create or update GitHub Release with APKs'
        required: false
        default: true
        type: boolean
      tag_name:
        description: 'Release tag (default: v3.2.6)'
        required: false
        default: 'v3.2.6'
        type: string

concurrency:
  group: build-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Release APKs
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs
        run: |
          set -euo pipefail
          FLAVOR="${{ inputs.flavor || 'all' }}"
          BUILD_TYPE="${{ inputs.build_type || 'release' }}"
          BUILD_TYPE_CAP="$(tr '[:lower:]' '[:upper:]' <<< ${BUILD_TYPE:0:1})${BUILD_TYPE:1}"

          echo "Building flavor: $FLAVOR, type: $BUILD_TYPE_CAP"

          if [ "$FLAVOR" = "all" ]; then
            ./gradlew :androidApp:assembleGoogle${BUILD_TYPE_CAP} :androidApp:assembleFdroid${BUILD_TYPE_CAP}
          elif [ "$FLAVOR" = "google" ]; then
            ./gradlew :androidApp:assembleGoogle${BUILD_TYPE_CAP}
          elif [ "$FLAVOR" = "fdroid" ]; then
            ./gradlew :androidApp:assembleFdroid${BUILD_TYPE_CAP}
          fi

      - name: Organize APK Artifacts
        run: |
          set -euo pipefail
          mkdir -p release-apks

          VERSION_NAME=$(grep '^app-version-name' gradle/libs.versions.toml | cut -d'"' -f2)
          echo "Detected version name: $VERSION_NAME"

          find androidApp/build/outputs/apk -type f -name "*.apk" | while read -r apk_path; do
            base_name=$(basename "$apk_path")
            echo "Processing APK: $apk_path ($base_name)"
            target_name=$(echo "$base_name" | sed "s/^androidApp-/MyTime-v${VERSION_NAME}-/")
            cp "$apk_path" "release-apks/$target_name"
            echo "Created: release-apks/$target_name"
          done

          echo "=== Summary of built APKs ==="
          ls -lh release-apks/

      - name: Upload Artifacts (Download from Action run)
        uses: actions/upload-artifact@v4
        with:
          name: MyTime-APKs
          path: release-apks/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true) || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag_name || 'v3.2.6' }}
          name: "MyTime ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag_name || 'v3.2.6' }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
