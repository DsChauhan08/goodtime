name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Product flavor to build (google, fdroid, or all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - google
          - fdroid
      build_type:
        description: 'Build type (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

concurrency:
  group: build-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK (ARM & Universal)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs
        run: |
          FLAVOR="${{ inputs.flavor || 'all' }}"
          BUILD_TYPE="${{ inputs.build_type || 'release' }}"
          BUILD_TYPE_CAP="$(tr '[:lower:]' '[:upper:]' <<< ${BUILD_TYPE:0:1})${BUILD_TYPE:1}"

          if [ "$FLAVOR" = "all" ]; then
            ./gradlew :androidApp:assembleGoogle${BUILD_TYPE_CAP} :androidApp:assembleFdroid${BUILD_TYPE_CAP}
          elif [ "$FLAVOR" = "google" ]; then
            ./gradlew :androidApp:assembleGoogle${BUILD_TYPE_CAP}
          elif [ "$FLAVOR" = "fdroid" ]; then
            ./gradlew :androidApp:assembleFdroid${BUILD_TYPE_CAP}
          fi

      - name: Organize APK Artifacts
        run: |
          mkdir -p apk-artifacts
          
          # Find all generated APKs and copy them with user-friendly names
          find androidApp/build/outputs/apk -type f -name "*.apk" | while read -r apk; do
            filename=$(basename "$apk")
            echo "Processing $apk"
            clean_name=$(echo "$filename" | sed 's/^androidApp-/MyTime-/')
            cp "$apk" "apk-artifacts/$clean_name"
          done
          
          echo "=== Artifacts ready for download ==="
          ls -lh apk-artifacts/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: MyTime-APKs
          path: apk-artifacts/*.apk
          retention-days: 30
