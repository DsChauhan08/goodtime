name: Build APK & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Flavor to build (fdroid, google, or all)'
        required: true
        default: 'fdroid'
        type: choice
        options:
          - fdroid
          - google
          - all
      build_type:
        description: 'Build type (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      create_release:
        description: 'Create or update GitHub Release with APKs'
        required: false
        default: true
        type: boolean
      tag_name:
        description: 'Release tag (default: v3.2.8)'
        required: false
        default: 'v3.2.8'
        type: string

concurrency:
  group: build-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Release APKs
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Write signing secrets (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release-keystore.jks
            echo "RELEASE_STORE_FILE=release-keystore.jks" >> "$GITHUB_ENV"
            echo "Keystore decoded successfully"
          else
            echo "No RELEASE_KEYSTORE_BASE64 configured, signing with debug key"
          fi

      - name: Build APKs
        env:
          RELEASE_STORE_FILE: ${{ env.RELEASE_STORE_FILE || '' }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          FLAVOR="${{ inputs.flavor || 'fdroid' }}"
          BUILD_TYPE="${{ inputs.build_type || 'release' }}"
          BUILD_TYPE_CAP="$(tr '[:lower:]' '[:upper:]' <<< ${BUILD_TYPE:0:1})${BUILD_TYPE:1}"

          echo "Building flavor: $FLAVOR, type: $BUILD_TYPE_CAP"

          if [ "$FLAVOR" = "all" ]; then
            ./gradlew :androidApp:assembleGoogle${BUILD_TYPE_CAP} :androidApp:assembleFdroid${BUILD_TYPE_CAP}
          elif [ "$FLAVOR" = "google" ]; then
            ./gradlew :androidApp:assembleGoogle${BUILD_TYPE_CAP}
          else
            ./gradlew :androidApp:assembleFdroid${BUILD_TYPE_CAP}
          fi

      - name: Organize APK Artifacts
        run: |
          set -euo pipefail
          mkdir -p release-apks

          VERSION_NAME=$(grep '^app-version-name' gradle/libs.versions.toml | cut -d'"' -f2)
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          BUILD_TYPE="${{ inputs.build_type || 'release' }}"
          echo "Detected version name: $VERSION_NAME, build type: $BUILD_TYPE"

          # Single good APK for fdroid: MyTime-v<version>.apk
          if [ -f "androidApp/build/outputs/apk/fdroid/${BUILD_TYPE}/androidApp-fdroid-${BUILD_TYPE}.apk" ]; then
            cp "androidApp/build/outputs/apk/fdroid/${BUILD_TYPE}/androidApp-fdroid-${BUILD_TYPE}.apk" "release-apks/MyTime-v${VERSION_NAME}.apk"
            echo "Created: release-apks/MyTime-v${VERSION_NAME}.apk"
          fi

          # Google flavor if built: MyTime-v<version>-google.apk
          if [ -f "androidApp/build/outputs/apk/google/${BUILD_TYPE}/androidApp-google-${BUILD_TYPE}.apk" ]; then
            suffix="-google"
            if [ ! -f "release-apks/MyTime-v${VERSION_NAME}.apk" ]; then
              suffix=""
            fi
            cp "androidApp/build/outputs/apk/google/${BUILD_TYPE}/androidApp-google-${BUILD_TYPE}.apk" "release-apks/MyTime-v${VERSION_NAME}${suffix}.apk"
            echo "Created: release-apks/MyTime-v${VERSION_NAME}${suffix}.apk"
          fi

          echo "=== Summary of built APKs ==="
          ls -lh release-apks/

      - name: Upload Artifacts (Download from Action run)
        uses: actions/upload-artifact@v4
        with:
          name: MyTime-APKs
          path: release-apks/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true) || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag_name || format('v{0}', env.VERSION_NAME) }}
          name: "MyTime ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag_name || format('v{0}', env.VERSION_NAME) }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
